[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callswap"
dynamic = ["version"]
description = "Replace a repeated LLM classification call with a local model, and get a proof of how often it agrees before you switch."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shubham Joshi" }]
requires-python = ">=3.11,<3.14"
keywords = ["llm", "classification", "routing", "distillation", "cost", "abstention", "calibration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
finetune = ["torch>=2.2", "transformers>=4.48"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
callswap = "callswap.cli:main"

[project.urls]
Homepage = "https://github.com/shubhamjoshipromail-svg/callswap"
Issues = "https://github.com/shubhamjoshipromail-svg/callswap/issues"
Changelog = "https://github.com/shubhamjoshipromail-svg/callswap/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["callswap"]

[tool.setuptools.dynamic]
version = { attr = "callswap.__version__" }

[tool.setuptools.package-data]
callswap = ["data/*.csv", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: downloads a model and fine-tunes it (run with: pytest -m slow)"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741", "E501", "B905"]  # long lines are mostly the HTML report template
